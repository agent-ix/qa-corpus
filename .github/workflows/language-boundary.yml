name: Language boundary

on:
  pull_request_target:

permissions:
  contents: read

jobs:
  guard:
    uses: agent-ix/engineering-assurance/.github/workflows/language-boundary-reusable.yml@71dbe634937a528673db1ce6ca5bb2f0d4ff06ce
    with:
      repository: ${{ github.repository }}
      pull_number: ${{ github.event.pull_request.number }}
      base_sha: ${{ github.event.pull_request.base.sha }}
      head_sha: ${{ github.event.pull_request.head.sha }}
