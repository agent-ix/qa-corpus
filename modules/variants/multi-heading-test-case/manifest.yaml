name: multi-heading-test-case
version: 0.1.0
description: Corpus-owned fixture module. A test-case target whose `section` is a PATTERN reaching several headings
artifact_types:
- name: FR
- name: TestMatrix
traceability:
  trace_targets:
  - name: test-case
    archetype: TestMatrix
    section: ['*Test Case Summary*']
    id_column: Test ID
  - name: acceptance-criterion
    archetype: FR
    section: Acceptance Criteria
    id_column: ID
  document_references:
  - name: verification
    archetype: FR
    section: Acceptance Criteria
    row_id_column: ID
    column: Verification
    pattern: '\b(TC-\d+)\b'
    targets: [test-case]
    expand_ranges: true
    strip_annotations: false
  - name: traces-to
    archetype: TestMatrix
    section: ['*Test Case Summary*']
    row_id_column: Test ID
    column: Traces To
    pattern: '\b((?:FR|TC)-\d+(?:-AC-\d+)?)\b'
    targets: [acceptance-criterion, test-case]
    expand_ranges: true
    strip_annotations: true
  obligations:
  - name: acceptance-criterion
    target: acceptance-criterion
    statement_column: Criteria
    method_column: Verification
  trace_tags:
    markers:
    - name: rust-trace-attribute
      language: rust
      pattern: '#\[trace\(((?:\s*"[^"]*"\s*,?)+)\)\]'
      template: '#[trace({ids})]'
    - name: pytest-trace-marker
      language: python
      pattern: '@pytest\.mark\.trace\(((?:\s*"[^"]*"\s*,?)+)\)'
      template: '@pytest.mark.trace({ids})'
    - name: ts-trace-helper
      language: typescript
      pattern: '\btrace\(((?:\s*"[^"]*"\s*,?)+)\)'
      template: 'trace({ids})'
