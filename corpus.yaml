# The controlled corpus. Contract: agent-ix/quire-rs FR-065.
#
# THIS FILE DECLARES INTENT. It does not record state.
#
# What a human writes here: the vocabularies, and the INVENTORY — for each
# case, the languages it should exist in, and any cell deliberately scoped out
# with its reason.
#
# What is DERIVED from the filesystem, every time, by `bounds.py`:
#   covered  — a fixture exists for that case and language
#   GAP      — declared applicable, no fixture, not scoped out
#   gap_count and the sum invariant
#
# So adding a fixture flips its own cell and drops gap_count with NO edit to
# this file (#289). A stored count is a number that can go stale; a derived one
# cannot disagree with the tree it describes.
#
# `bounds.gap_count` is a COUNT, never a ratio (FR-065-CON-2). A ratio falls as
# easy cases are added, so a corpus could improve its number while the hard
# missing case stayed missing.
#
# The vocabularies below are read by both runners rather than compiled into
# either (FR-065-AC-19..21) — which is what makes `one definition` checkable
# from a single repository.

schema_version: 2
mode_families:
- minting
- detection
- attachment
- parser
- join
- disposition
- provenance
- skeptic
# A separate population, graded by Quoin rather than by the Quire coverage
# harness. It shares this inventory and GAP ratchet without becoming a false
# member of detection recall.
reporting_modes:
- reporting
# The reporting runner reads this list. Required cases and refusal controls are
# declarations here, not literals hidden in a script, so adding or removing a
# contract row changes the gate in the same review.
reporting_contract:
  required_cases:
  - definition-version-changed
  - config-digest-changed
  - population-changed
  - metric-stopped-being-computed
  - tool-version-differs
  - incomplete-population
  - identical-inputs-rerendered
  - no-prior-record
  refusal_cases:
  - definition-version-changed
  - config-digest-changed
  - incomplete-population
bounds_states:
- covered
- out-of-scope
- GAP
grading_levels:
- L1
- L2
- L3
case_kinds:
- failure
- control
# A fixture that pins behaviour a LANDED ticket established, rather than a
# defect that still reproduces. No control, not findable, no `pending:`.
#
# Added when the first Wave 3 fix landed. #274's fixture had a control that was
# the same content written the way the BROKEN parser could handle — so once the
# parser was fixed both spellings parsed identically and the pair had nothing
# left to separate. FR-065-AC-42 rejected it, correctly. The input is still the
# shape that used to break, and asserting it parses is worth keeping.
#
# Not every fix leaves one behind. Where a fix makes a diagnostic FIRE, the
# control stays silent and the pair keeps discriminating (FR-065-AC-43/44).
- regression

# THE CASE-METADATA SCHEMA. One declaration, both readers.
#
# WHY THIS EXISTS. Two readers implement this corpus on purpose, so that reader
# drift is VISIBLE. An outside review checked whether it is, and it was not: the
# Rust reader rejects a missing required field (serde) and duplicate ids (its own
# test), and the Python reader checked neither. Reproduced — remove `issue_ref`
# from a `case.yaml`, or point two cases at one id, and `python3 bounds.py` exited
# 0 reporting all <derived:fixtures=175> fixtures either way (agent-ix/quire-rs#336).
#
# The fix is NOT a second hand-written list of required fields in Python. That is
# the same defect one level up: two lists, free to disagree, with nothing
# comparing them. The required set lives HERE, `bounds.py` validates against it
# before deriving anything, and a Rust test asserts `CaseMeta` agrees with it —
# so the day a field is added to one reader and not the other, a gate says so.
#
# WHAT THIS DESCRIBES is the EFFECTIVE record: a language set's shared
# `case.yaml` merged with its per-language one, with `language` taken from the
# directory name (CR-109). It is deliberately not "required in every file" —
# a set splits the declaration across two, and requiring both would forbid sets.
case_schema:
  # Present and non-empty in every effective record.
  #
  # This is FR-065's own list — `id`, `issue_ref`, `mode`, `language`, `module`,
  # `findable`, `reproduce`, `kind` — plus `tags`, which TC-1021 already requires
  # to carry a `TC-` id and which was therefore required by a gate and by no
  # declaration. `findable` and `reproduce` are required rather than DEFAULTED:
  # a default silently supplies a field the author did not write, which is the
  # mechanism behind the review's mutation. Both readers are held to this list;
  # TC-1043 deletes each entry from a real declaration and requires the Rust
  # reader to refuse it, so "required" is a behaviour rather than two lists.
  required:
  - id
  - issue_ref
  - mode
  - module
  - kind
  - language
  - reproduce
  - findable
  - tags
  # Everything else a case may carry. Anything in neither list is REJECTED: an
  # unmodelled field is a field nothing checks, which is how a typo'd
  # expectation was once silently dropped by the CI gate itself.
  #
  # `comment` is here rather than in `required` on purpose. All 45 declare one
  # and no gate asks for it, so requiring it would be promoting a convention to
  # a rule because the count happened to be 45/45. `case` is in FR-065's
  # required list and is NOT required here: no control declares one, and both
  # readers DERIVE it from the id when absent — the requirement as written
  # describes the effective record after derivation, not the file.
  optional:
  - case
  - comment
  - control_for
  - pending
  - pending_reason
  - relaxation_ticket
  - declaration_under_test
  - grading_contract
  # The type of every declared field. `str`, `bool`, or `[str]` for a list.
  #
  # Presence was not enough, and a mutation proved it rather than an argument:
  # reverting `new_case.py` to write `control_for` as a bare STRING left this
  # reader silent, because it only checked that the field was there and not
  # empty. The Rust reader refuses the same file — `Option<Vec<String>>` — so
  # the scaffolder could emit a case one reader loaded and the other could not,
  # which is precisely the drift the pair exists to expose (#336).
  types:
    id: str
    issue_ref: str
    mode: str
    module: str
    kind: str
    language: str
    reproduce: str
    findable: bool
    tags: [str]
    case: str
    comment: str
    control_for: [str]
    pending: str
    pending_reason: str
    relaxation_ticket: str
    declaration_under_test: str
    grading_contract: grading_contract
  by_kind:
    failure:
      # The only kind that may claim a defect is detectable, so the only kind
      # with no `findable` constraint. All 24 today declare `findable: true`;
      # a non-findable failure is an unexercised escape hatch that skips the
      # AC-40 names-what-finds-it check, and is left legal deliberately.
      forbidden: [control_for]
    control:
      # Healthy input. Nothing may be found on it, and it names the failure
      # case(s) it is the repair of.
      required: [control_for]
      forbidden: [pending, pending_reason, case]
      values: {findable: [false]}
    regression:
      # Pins behaviour a LANDED ticket established. No control, nothing to find,
      # no pending ticket — the ticket is closed (CR-123).
      forbidden: [control_for, pending, pending_reason]
      values: {findable: [false]}
  # Evaluated on the effective record, after `by_kind`.
  conditional:
  - if_present: pending
    then_required: [pending_reason]
    why: a marker with no reason is one nobody can decide whether to remove
  # A variant declares only what VARIES. These say WHICH case this is, and the
  # shared file is where that claim lives (FR-065-AC-22). PRESENCE is the test,
  # not disagreement: an injected `pending:` on one control variant converted a
  # silence-proving control into an expected failure and every gate stayed green.
  variant_forbidden:
  - case
  - mode
  - module
  - kind
  - pending
  # Derived ids must be unique across the whole corpus. A collision silently
  # merges two cases in every join keyed on id — the pending list, the baselines,
  # any cross-runner record.
  unique: [id]

# EVERY diagnostic reason a fixture may name, and the only place a new token is
# introduced. Both runners reject a token that appears in neither list.
#
# Without this the forward half of a pending case asserted NOTHING checkable:
# measured, replacing a forward block with
# `diagnostic_reasons: [totally-bogus-token-unrelated-to-270]` left 12/12 Rust
# tests, 32/32 Python and the bounds matrix all green, with the case still
# printing "PENDING — expected to fail, and did". A typo'd token would stay
# pending forever, after its ticket had shipped, and no gate would ever say the
# fixture had stopped meaning anything.
diagnostic_reasons:
  # Tokens the engine emits TODAY. A live `expect.yaml` may name these.
  emitted:
  # agent-ix/quire-rs#304, landed: a declared TRACE TARGET whose archetype
  # names no document in the corpus. It was computed correctly all along and
  # then thrown away by a model-wide gate — `into_diagnostics(minted_anything)`
  # dropped every one of them as soon as ANY declaration minted, so one
  # declaration's success hid another's failure. A repository with no
  # TestMatrix reported `groups` holding only `acceptance-criterion`, the whole
  # `test-case` target MISSING from the payload rather than present and zero,
  # and said nothing about it.
  #
  # SCOPE THE ASSERTION, NOT THE TOKEN. Measured across 245 ecosystem
  # repositories after the gate came out: 741 findings over 243 of them, and
  # `inspection` and `suite` account for 484 of those — they fire on 242 repos
  # each, because almost nobody writes `suites.md` or `inspections.md`. That is
  # a fact about the DECLARATION, filed as `agent-ix/spec-artifacts-process#75`,
  # not a defect in each repository and not a reason to re-suppress the token.
  # `test-case`, the signal #304 is about, is 57 repositories.
  #
  # So a fixture in a three-file tree writes `test-case/archetype-matches-nothing`
  # rather than the bare token: the bare form would now assert something false.
  # Reference declarations are excluded at the source — their sections are
  # legitimately optional, which is the same `mints` distinction that keeps
  # `section-matches-nothing` off healthy repositories.
  - archetype-matches-nothing
  - catch-all-universal
  - hollow-denominator
  # agent-ix/quire-rs#270, landed: the archetype matched the document and the
  # declared table did not. Two tokens rather than one because the two faults
  # differ in exactly one field of the payload — a wrong section strands the
  # table and `unbacked_rows` is empty, a wrong id column reads it and mints a
  # row whose `row_id` is null — and agree in every field a reader looks at.
  - id-column-matches-nothing
  - low-symbol-binding
  # agent-ix/quire-rs#367: mixed binding channels can keep the aggregate
  # census healthy while a repository's self-named test convention binds
  # nothing. This token is specific to that retained subpopulation.
  - marker-form-mismatch
  - model-mints-nothing
  - no-symbol-bound
  - obligation-row-states-nothing
  # agent-ix/quire-rs#320: every declared section the document HAS holds no
  # table, so it mints nothing and neither sibling diagnostic can fire — the
  # section WAS found, and there is no table to read an id column from. Landed
  # because #272's widening made three repositories match a table-less heading
  # and LOSE their section-matches-nothing while still minting zero.
  - section-holds-no-table
  - section-matches-nothing
  # agent-ix/quire-rs#341: a reference table exposes a status-shaped header,
  # but not the model-wide configured status column. The rows are still read;
  # only status classification was silently skipped, hiding status lies.
  - status-column-matches-nothing
  # agent-ix/quire-rs#312, landed: a trace tag written on a symbol whose kind
  # cannot bind it. `trace::bind` takes the `carries_implements()` branch and
  # the tag reaches NO channel — `verifies` refuses it by kind, `implements`
  # wants the literal keyword the comment does not carry, and `binding_census`
  # never counts it, because a non-binding symbol is missing from `candidates`
  # rather than counted as unbound. So `no-symbol-bound` and
  # `low-symbol-binding` both read a denominator the defect has been removed
  # from, and a repository whose tags are ALL in the wrong place reported a
  # flawless 100%.
  #
  # Two rows share the token because the two predicates are exact COMPLEMENTS:
  # `binds_trace_ids()` is {TestFunction, Benchmark, FuzzTarget} and
  # `carries_implements()` is {Function, Container} — five variants, disjoint,
  # covering. `tag-at-module-scope` (the file's `Container`) and
  # `tag-on-non-test-function` (a production `Function`) are dropped by the
  # SAME branch.
  - tag-on-non-binding-symbol
  # agent-ix/quire-rs#307, landed: an id in `untracked_symbols` that differs
  # from one in `unbacked_rows` only by zero-padding, case or separator. The
  # engine held both halves and joined neither — `rust-test-name-id` renders its
  # captured digits verbatim, so `fn tc_1_…` mints `TC-1` while the row declares
  # `TC-001`.
  #
  # Neither older diagnostic can fire, and both stand down for the SAME reason:
  # `no-symbol-bound` needs `bound == 0` and `hollow-denominator` needs
  # `matched == 0`, and here both are 1. From their vantage point the binding
  # worked — it bound to the wrong id — so the repository reports a healthy
  # census beside a zero backing ratio with nothing explaining the gap.
  - untracked-id-near-miss
  # agent-ix/quire-rs#328: a bound id is not itself minted, but the active
  # model mints exact descendants of it. The finding names those real targets
  # rather than silently grouping the tag with an unrelated typo.
  - untracked-id-has-minted-children
  - uncatalogued-verification-method
  - undeclared-coverage-vocabulary
  # Tokens no engine emits YET, each naming the ticket that will add it. A
  # forward `expect-pending.yaml` may name only these, and only when the case's
  # own `pending:` is the SAME ticket — so a fixture cannot sit pending on one
  # ticket while asserting another's behaviour.
  #
  # A control MAY name a forward token in `absent_diagnostic_reasons`: that
  # assertion is vacuous today and load-bearing the day the ticket lands, which
  # is exactly what a control is for. A FAILURE case may not — its live block
  # would then assert the absence of the very thing it is waiting for, and be
  # guaranteed to break on the fix rather than pass it.
  #
  # When a ticket lands, its token MOVES from `forward` to `emitted`. That edit
  # is the one that makes every pending fixture in its group go green at once.
  # EMPTY, and kept for the same reason `suppressed` is: the class is real and
  # every member has graduated. `tag-on-non-binding-symbol` (#312) and
  # `untracked-id-near-miss` (#307) both landed and moved to `emitted`. The
  # next fixture written red against a token no engine has yet is declared
  # here, and until then TC-1026 proves the rule can still fail rather than
  # requiring a member to exist.
  forward: {}

  # Tokens the engine COMPUTES and then DISCARDS. Neither `emitted` (it does
  # not reach the payload on the input in question) nor `forward` (the literal
  # is already in `src/`, so TC-1026's scan finds it).
  #
  # A forward block may require a suppressed token when its `pending` is the
  # ticket that un-suppresses it. This is a third ticket class: not "adds a
  # diagnostic" and not "changes what mints", but "stops discarding one".
  #
  # EMPTY SINCE agent-ix/quire-rs#304 LANDED, and kept rather than deleted: the
  # class is real and its one member graduated. `archetype-matches-nothing` was
  # computed correctly for the right declaration and thrown away by a model-wide
  # gate; it is in `emitted` now. The next ticket of this shape has somewhere to
  # be declared.
  suppressed: {}

# Tickets that change what the engine MINTS rather than adding a diagnostic.
#
# The forward-token rule (AC-36) was written when every pending fix was a new
# diagnostic, and it does not fit a fix like `agent-ix/quire-rs#272` — which
# made `TraceTarget.section` accept several headings, so rows that were
# invisible start minting. There is no token to name; the payload simply
# changes.
#
# A forward block pending on one of these SHALL instead assert the same
# exactly-graded keys its live block does, with at least one different value.
#
# That is a SHAPE rule and it does not close the vacuity by itself: `total: 999`
# restates every key and differs from today, yet is wrong after the fix too.
# What closes it is FR-065-AC-42's differential — such a block must HOLD
# against its control's payload, the control being the repaired tree, which is
# what the engine should produce once the ticket lands. That needs an engine,
# so it lives in the graders rather than here.
#
# `agent-ix/quire-rs#272` LANDED (CR-118, engine v0.33.0) and is gone from this
# list. Its case, `rows-across-many-headings`, folded its forward block into
# `expect.yaml` re-measured, and the prediction held exactly: `total` 2 -> 4,
# `backed` 1 -> 3, `untracked_symbols` emptied.
# EMPTY, and kept for the same reason `forward` and `suppressed` are: the class
# is real and its one member was resolved.
#
# It named `agent-ix/quire-rs#273` — "registers `describe()`/`suite()` headers
# as Containers, so a tag on the header has something to attach to" — and that
# fixture's forward block demanded the tag BIND. It waited on
# `agent-ix/quire-rs#312`, "which owns the channel question", and #312 landed
# the OTHER answer: a tag on a symbol whose kind cannot bind it does not start
# binding, it gets reported. So the forward block was demanding an outcome the
# ecosystem had declined, and `tag-on-describe-header` is a live case asserting
# `tag-on-non-binding-symbol` now.
#
# No fixture currently predicts a ticket that changes what mints.
behaviour_change_tickets: []
# `result_record:` DELETED, 2026-08-24, outside review — `agent-ix/quire-rs#279`.
#
# It declared a per-case output envelope — case/mode/language/kind/outcome/
# level_reached/level_lost/pending/mismatches — and said the field set and order
# were declared here so FR-065-AC-17's byte-identity had a defined shape to be
# identical about.
#
# NO RUNNER EVER EMITTED IT. The only references were this declaration and the
# prose describing it. TC-1019 compares two `CoverageReport::to_json()` payloads,
# which is report determinism and a real property; it is not the declared record.
# `verify.py` emits nothing of the kind either. So AC-17 was marked implemented
# while its subject did not exist, and this block was the evidence for a contract
# no code was under.
#
# Deleted rather than implemented, deliberately: the review's standing instruction
# is to freeze FR-065 except for demonstrated defects, and a cross-runner record
# is a want nothing has yet asked for. AC-17 is narrowed to what TC-1019 tests.
# If a cross-runner join needs a record later, it arrives with the consumer that
# needs it, and this comment is the note that it was once declared without one.
# THE MODE-SPECIFIC WITNESS. Which output channel constitutes DETECTION of a
# defect of this family.
#
# WHY. FR-065-AC-42 requires a failure case's live block to produce at least one
# mismatch against its control's payload. That closes empty blocks and assertions
# true of every input, and the outside review of 2026-08-24 was right that it
# stops there: it proves an assertion distinguishes THESE TWO PAYLOADS, not that
# the assertion concerns the SEEDED DEFECT. Measured by running every case and
# every control and comparing `totals.total`, over the whole controlled
# population at `801afd5`: **14 of the 35 (case, control) pairs differed in
# `total`** — so for those, an incidental row count satisfies the whole rule
# while saying nothing about the family the case is named for.
#
# RE-MEASURED at engine `5a68ceb`: **15 of <derived:pairs=79>**. The pair count
# is tagged and gated; the 13 is NOT, and cannot be — it needs a payload from
# every control, which means running the engine, which `bounds.py` deliberately
# does not do. `verify.py` is where that number can be re-derived. It is dated
# rather than gated, and this sentence says which.
#
# So AC-42 is graded TWICE: once over the whole block, and once over the block
# RESTRICTED to these keys. The restriction must still mismatch. An assertion
# that separates the trees only through a channel this mode is not about does
# not detect this mode's defect.
#
# `total` APPEARS ONLY UNDER `minting`, deliberately, and that is the whole
# point of the rule. A minted-row count IS the minting channel; everywhere else
# it is the incidental global scalar the review named. `backed` is likewise
# absent from `minting`: a row's minting and its backing are different facts,
# and #318 is the standing example of confusing them.
#
# MEASURED BEFORE IT WAS WRITTEN, over EVERY failure block and not only the
# controlled ones. Population: <derived:failure_fixtures=78> `kind: failure`
# fixtures, all <derived:controlled_failures=78> controlled. The last three
# uncontrolled skeptic cells gained language-matched controls when #224 added
# the claim+wiring+capability validator.
#
# THIS SENTENCE READ "All 37 controlled failure blocks" UNTIL CR-132, which is
# a population error: 37 is out of 41 failure blocks, not out of the 34
# controlled ones, and the "four that name none" two lines down only adds up
# against 41. The commit messages and `spec/log.md` stated it correctly; this
# file — the one a fixture author actually reads — did not.
# `validate_contains` / `validate_absent` ARE A WITNESS IN EVERY MODE, and the
# reason is that they are not a coverage channel at all. `quire validate` is the
# corpus's SECOND ORACLE: it reads the spec tree and reports structure, and a
# defect visible only to it produces a coverage payload byte-identical to a
# healthy one — `wrong-type-cell` is exactly that, an undeclared `Type` cell
# whose whole claim is structural. Excluding those keys from a mode's set would
# assert "a structural defect cannot be evidence for this family", which is
# false for any family whose defect can be authored into the document rather
# than into the code.
#
# This is a real weakening for structural cases and it is said out loud rather
# than left for a reader to discover: within one mode, a case CAN satisfy AC-46
# through the validate oracle alone. The rule's teeth are elsewhere — `total`,
# `backed` and `groups` are barred as universal evasions, and those are what the
# review actually caught being used.
witness_channels:
  # Did the declaration reach the rows it names, and did the engine say so?
  minting: [total, groups, unbacked_rows, no_symbol_rows, validate_contains,
            validate_absent, diagnostic_reasons, diagnostic_paths,
            diagnostic_lines, diagnostic_message_contains, absent_diagnostic_reasons]
  # Did the tag reach the symbol, and WHICH channel received it?
  #
  # `metrics` is in this set because `coverage.implements` is literally "did
  # this symbol's annotation attach to a requirement" — the attachment question
  # asked of the other channel. `tag-on-non-test-function` is the case that
  # proves it belongs: its control leaves the annotation exactly where it is and
  # rewrites it as `/// Implements: FR-001-AC-1`, so `backed`, `groups`,
  # `unbacked_rows` and the census are byte-identical across the pair and
  # `coverage.implements` is the ONLY field that moves. The fixture's own
  # comment says so — "THIS IS THE FIELD THAT DISCRIMINATES, and it is the only
  # one" — which is why this is a correction to the rule and not a widening to
  # accommodate a case.
  attachment: [binding_census, backed, untracked_symbols, unbacked_rows, metrics,
               diagnostic_reasons, diagnostic_paths, diagnostic_lines, diagnostic_message_contains,
               absent_diagnostic_reasons, validate_contains, validate_absent]
  # Did the scanner extract the symbol at all?
  parser: [binding_census, backed, untracked_symbols, diagnostic_reasons,
           diagnostic_paths, diagnostic_lines, diagnostic_message_contains,
           absent_diagnostic_reasons, validate_contains, validate_absent]
  # Did the tag and the minted id meet?
  join: [backed, unbacked_rows, untracked_symbols, groups, diagnostic_reasons,
         diagnostic_paths, diagnostic_lines, diagnostic_message_contains,
         absent_diagnostic_reasons, validate_contains, validate_absent]
  # Did the toolchain SURFACE the discrepancy — as a finding, or as a symbol
  # with no home, or as a row with no evidence?
  #
  # `untracked_symbols` and `unbacked_rows` are detection channels, not
  # bookkeeping. A stale test name mints `TC-999` and the only place that
  # becomes visible is `untracked_symbols`; a `TC-1` / `TC-001` mismatch is
  # visible as one id homeless and one row unbacked, in the same payload, which
  # is #307's entire thesis. Neither raises a diagnostic today — that is the
  # defect — so a set restricted to diagnostics would demand of these cases the
  # very output the engine is missing.
  #
  # `total`, `backed` and `groups` stay OUT: they are population counts, and a
  # population that happens to differ is the incidental scalar this rule exists
  # to disqualify.
  detection: [metrics, untracked_symbols, unbacked_rows, diagnostic_reasons,
              diagnostic_paths, diagnostic_lines, diagnostic_message_contains,
              absent_diagnostic_reasons, validate_contains, validate_absent,
              suspicions, absent_suspicions]
  # Was every authored row put in exactly one bucket?
  disposition: [metrics, groups, unbacked_rows, untracked_symbols,
                diagnostic_reasons, diagnostic_paths, diagnostic_lines,
                diagnostic_message_contains, absent_diagnostic_reasons, validate_contains, validate_absent]
  # Does the payload say what produced it?
  provenance: [metrics, binding_census, diagnostic_reasons, diagnostic_paths,
               diagnostic_lines, diagnostic_message_contains, absent_diagnostic_reasons, validate_contains, validate_absent]
  # Did the skeptic layer flag the suite that proves nothing?
  #
  # `suspicions` and `absent_suspicions` were MISSING here, and that is the
  # whole of agent-ix/quire-rs#358: the skeptic layer reports on
  # `coverage.suspicions`, this list named every channel EXCEPT that one, and so
  # the mode family whose entire subject is suspicions could not name its own
  # subject. `vacuous-property-suite` was detected at `src/lib.rs:7` the whole
  # time, asserting `backed`/`total`/`binding_census` — true of any healthy
  # three-row tree — which is why it was byte-identical to two other fixtures
  # and why swapping their input trees left `make ci` green.
  skeptic: [suspicions, absent_suspicions, external_observations, metrics, diagnostic_reasons, diagnostic_paths, diagnostic_lines,
            diagnostic_message_contains, absent_diagnostic_reasons, validate_contains, validate_absent]


# THE INVENTORY declares which (mode, case, language) cells SHOULD exist. Every
# cell it does not name is invisible to `gap_count` — so an undeclared hole and
# a filled one look identical from the outside, which is the conflation this
# whole file exists to end, applied to itself.
#
# **`gap_count` 4 -> 31. THIS IS A CORRECTION, NOT A REGRESSION.**
#
# 18 of the 29 rows declared a single language and none of them said why. 37 of
# the 87 mode x case x language cells were not declared at all, so the corpus
# reported `gap_count: 4` over a space it had defined to be almost entirely
# covered. Declaring the space moves the count to what was already true:
#
#     declared cells   50 -> 88     covered 46     out-of-scope 1 -> 11     GAP 4 -> 31
#
# (88 rather than 85 because `section-holds-no-table` joined the inventory in
# the same pass — a Wave 3 token, landed in `204dca4`, published, and asserted
# by no fixture in either direction until then.)
#
