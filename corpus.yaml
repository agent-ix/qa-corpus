# about what would be tedious to write. A cell is `out_of_scope` only where the
# defect cannot be expressed in that language or the detector deliberately does
# not run there:
#
#   * `test-name-id-*` — the manifest declares `rust-test-name-id` and
#     `typescript-test-name-id` and NO python sibling, and the two forms read
#     different things (a function name, a call title), which is why they are
#     two rows rather than one language set.
#   * `tag-at-module-scope` / `tag-on-describe-header` — `symbols/rust.rs` emits
#     no file-level container and no registration-call form.
#   * `triple-quote-scope-desync` — neither Rust nor TypeScript has a
#     triple-quoted string literal.
#   * `vacuous-property-suite` — `narrowing_guards_for` returns an EMPTY list
#     for Python and TypeScript by deliberate decision (CR-102), measured at 549
#     false suspicions from 551 candidates when it did not.
#
# Everything else is a GAP, including cases whose detector does not exist in ANY
# language. Scoping those out would be recording "we have not built it" as "it
# does not apply", and the difference between those two sentences is the whole
# subject of `known_gaps`.
