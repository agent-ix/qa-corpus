# The controlled corpus. Contract: agent-ix/quire-rs FR-065.
#
# `bounds.gap_count` is a COUNT, never a ratio (FR-065-CON-2). A ratio falls
# as easy cases are added, so a corpus could improve its number while the hard
# missing case stayed missing. Converting a GAP to out-of-scope moves this
# number, which makes scoping something out a visible act.
#
# The vocabularies below are declared HERE and read by both runners rather
# than compiled into either (FR-065-AC-19..21) — which is what makes
# `one definition` checkable from a single repository.
#
# `shipped: true` rows are cases that EXIST. They are still GAP, because they
# bind a relaxation variant and therefore exercise no ecosystem mode. Omitting
# them (the first draft) reached covered:0 by not listing them, which is a
# different and worse claim than grading them.

schema_version: 1
mode_families:
- minting
- detection
- attachment
- parser
- join
- disposition
- provenance
bounds_states:
- covered
- out-of-scope
- GAP
grading_levels:
- L1
- L2
- L3
case_kinds:
- failure
- control
result_record:
  description: The per-case record a runner emits. Field set and order are declared here so FR-065-AC-17's
    byte-identity has a defined shape to be identical about.
  fields:
  - case
  - mode
  - language
  - kind
  - outcome
  - level_reached
  - level_lost
  - mismatches
  outcome:
  - pass
  - fail
  - rejected
