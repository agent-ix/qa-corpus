- mode: attachment
  # MEASURED. The row was filed naming a code predicate and no population.
  # Censused over ~/dev with worktrees, -task<N> copies, node_modules, build and
  # virtualenv trees excluded, and this repository excluded so the fixtures do
  # not census themselves: a declared comment-id form anywhere in a NON-test
  # file, where every enclosing symbol is production and no kind binds. 1,677
  # occurrences across 86 repos — python 497/47, rust 943/6, typescript 237/36.
  #
  # That is a superset of "directly above a production function": it also counts
  # ids inside a production body and file-header banners, which land on the same
