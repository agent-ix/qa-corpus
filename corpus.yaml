# DEPARTURES FROM THE CONTRACT, declared and ENFORCED.
#
# This block was read by NO CODE. It listed three uncontrolled failure cases
# where eleven were true — a declaration nobody checked, describing a corpus it
# had drifted from, which is the shape this whole corpus exists to end.
#
# Both readers now read it. An entry here is permitted; anything NOT here is
# rejected, and an entry naming no case is rejected too. So the list cannot go
# stale in either direction: a new violation fails the run, and burning one
# down means deleting a line.
# STANDING ADJUDICATIONS — a ruling made once, about the whole corpus, rather
# than 300 times in 76 files.
#
# WHY THIS EXISTS. `agent-ix/quoin#245` made a scoring consumer publish, per
# advisory family, the count of firings NOBODY HAS RULED ON — and the first
# measurement was **316 of 319** for `archetype-matches-nothing`. That number is
# honest and the obvious way to move it is wrong: adding the token to 76
# `expect.yaml` files would be 300 edits made to satisfy a counter, which is
# corpus-tuning wearing adjudication's clothes.
#
# The right ruling is one sentence, because the fact is one fact. This corpus
# binds the REAL ecosystem declaration (`agent-ix/quire-rs#292`), which declares
# targets for `Inspections`, `SuiteRegistry`, `NFR` and `StR`. A three-file
# minimal fixture carries none of those documents, so those four declarations
# correctly match nothing on nearly every case in the tree. It is a fact about
# FIXTURE SIZE, exactly as it is a fact about the ecosystem that almost nobody
# writes `suites.md` — 484 of 741 findings over 245 repositories, filed as
# `agent-ix/spec-artifacts-process#75`.
#
# A consumer reads this and treats a firing it covers as ruled-correct. What it
# does NOT cover stays unadjudicated and stays counted: `test-case`, the
# declaration `#304` is actually about, is deliberately absent from the
# `declarations` list below, so a `test-case/archetype-matches-nothing` on a
# case that carries a TestMatrix remains a firing somebody has to rule on.
standing_adjudications:
- reason: archetype-matches-nothing
  verdict: correct
  # The four declarations whose archetypes no minimal fixture carries. NOT a
  # wildcard: the point of the ruling is that these four are uninformative and
  # `test-case` is not.
  declarations:
  - inspection
  - suite
  - nfr-acceptance-criterion
  - stakeholder-validation-criterion
  - source-id
  reason_why: >-
    The corpus binds the real ecosystem declaration, which declares targets for
    Inspections, SuiteRegistry, NFR and StR. A minimal fixture carries none of
    those documents, so these four match nothing on nearly every case — a fact
    about fixture size, not a detection event. `test-case` is excluded on
    purpose: it is the declaration agent-ix/quire-rs#304 is about, and a firing
    there is a fact about the fixture's own subject. `source-id` is the same
    fixture-topology class in the reference-postures variant: its reference-only
    failure input intentionally carries ReferenceFR and no SourceFR, while the
    paired control carries SourceFR. The ruling is restricted to those five
    declarations; it is not a reason-wide wildcard.

known_gaps:
  control_binds_another_module:
    reason: >-
      #359 tests declaration-level diagnostics. Their healthy controls must vary the
      declaration itself; an input-only repair cannot remove a module defect.
    cases:
    - model-mints-nothing-control
    - undeclared-coverage-vocabulary-control
