# THE ENGINE READS THE TAG PERFECTLY AND JOINS IT TO NOTHING.
#
# This is the row where the binder is not at fault in any way. The tag is not
# missing, not misplaced, and not in an unreadable form:
#
#   binding_census  python  candidates 2, bound 2   <- 100%, and honestly so
#
# Both tags bind. `python`'s comment-id form admits a bare `FR-\d+`, the
# enclosing symbol is a test function, and the engine records the relation. What
# it recorded is a relation to an id the declaration never minted:
# `acceptance-criterion` mints `FR-001-AC-1`, `test-case` mints `TC-001`, and
# the bare document id `FR-001` is none of those — not minted, not referenced by
# any table cell, not any row's own id (`coverage.rs:1198`).
#
# DETECTION REACHES L3. `untracked_symbols` preserves the exact authored locus,
# and `untracked-id-has-minted-children` names the real criterion id the author
# can use without pretending the coarse tag backs every child.
#
# This fixture therefore asserts the DETECTION rather than its absence. Its job
# is to stop that pair regressing, and `untracked_symbols` is the field the
# corpus already relies on for #272.
#
# THE PAYLOAD CARRIES A LINE (13) THAT THIS BLOCK CANNOT ASSERT. Both graders
# compare `untracked_symbols` on (symbol, trace_id, path) only, deliberately —
# two identical bindings in one file are one defect, not two records
# (`coverage.rs:1247`). The line is in the JSON and a reader gets it; the
# assertion stops at the file.
#
# NOT A NEAR MISS IN #307's SENSE. That ticket pairs ids differing by zero
# padding, case or separator — `TC-1` against `TC-001`. `FR-001` against
# `FR-001-AC-1` differs by a whole id segment, and a rule that joined them would
# back every criterion of a requirement from one test naming the requirement.
#
# MIXED on purpose: one bare requirement id beside one minted test-case id, so
# the census stays at 100% and no binding diagnostic can be credited for
# catching this.
total: 4
backed: 1
groups:
  - document: spec/FR-001.md
    target: acceptance-criterion
    backed: 0
    total: 2
  - document: spec/tests.md
    target: test-case
    backed: 1
    total: 2
unbacked_rows:
  - document: spec/tests.md
    row_id: TC-001
    target_ids: [FR-001-AC-1, TC-001]
  - document: spec/FR-001.md
    row_id: FR-001-AC-1
    target_ids: [FR-001-AC-1, TC-001]
# THE DETECTION. Exact, both directions: an extra entry, a missing one, a
# changed field or a different order all fail (FR-065-AC-28).
untracked_symbols:
  - symbol: test_defaults_every_finding_to_warning
    trace_id: FR-001
    path: src/test_coverage.py
binding_census:
  - language: python
    candidates: 2
    bound: 2
diagnostic_reasons:
  - untracked-id-has-minted-children
diagnostic_paths:
  untracked-id-has-minted-children: src/test_coverage.py
diagnostic_message_contains:
  untracked-id-has-minted-children: [FR-001-AC-1]
# None of these may fire: the binder read this tree correctly and said so.
# Crediting a binding diagnostic here would be crediting it for noise.
absent_diagnostic_reasons:
  - no-symbol-bound
  - low-symbol-binding
  - hollow-denominator
