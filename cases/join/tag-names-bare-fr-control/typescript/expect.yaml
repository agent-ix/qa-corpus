# THE CONTROL, WITH ROW QUALIFICATION AND THE FOUR-CHARACTER CRITERION-ID CORRECTION.
#
# The control adds the declared row id `TC-001` alongside the corrected criterion id.
# The failure still carries bare `FR-001`; the control carries `TC-001` and
# `FR-001-AC-1`. Both use the same two tests and comment form.
#
#   case      backed 1/4  ac 0/2  1 untracked  4 unbacked
#   control   backed 3/4  ac 1/2  0 untracked  2 unbacked
#
# The measured delta is backed 1 -> 3, criterion group 0/2 -> 1/2, test-case
# group 1/2 -> 2/2, unbacked rows 4 -> 2, and untracked symbols 1 -> 0. The
# binding census remains 2 of 2 on both sides.
#
# `untracked_symbols: []` is the assertion that matters most. Its partner names
# one entry; this names none. A change that stopped populating the field
# altogether would leave this block green and break the partner's, which is the
# direction that catches a silent removal.
total: 4
backed: 3
groups:
  - document: spec/FR-001.md
    target: acceptance-criterion
    backed: 1
    total: 2
  - document: spec/tests.md
    target: test-case
    backed: 2
    total: 2
unbacked_rows:
  - document: spec/tests.md
    row_id: TC-002
    target_ids: [FR-001-AC-2, TC-002]
  - document: spec/FR-001.md
    row_id: FR-001-AC-2
    target_ids: [FR-001-AC-2, TC-002]
binding_census:
  - language: typescript
    candidates: 2
    bound: 2
absent_diagnostic_reasons:
  - untracked-id-has-minted-children
  - no-symbol-bound
  - low-symbol-binding
  - hollow-denominator
