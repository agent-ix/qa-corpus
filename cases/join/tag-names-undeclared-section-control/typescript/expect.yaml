# from `FR-001-INV-1` to `FR-001-AC-1`. The `## Invariants` table remains
# present and unminted, and the same two tests and comment form remain.
#
#   case      backed 1/4  ac 0/2  1 untracked  4 unbacked
#   control   backed 3/4  ac 1/2  0 untracked  2 unbacked
#
# The measured delta is backed 1 -> 3, criterion group 0/2 -> 1/2, test-case
# group 1/2 -> 2/2, unbacked rows 4 -> 2, and untracked symbols 1 -> 0. The
# binding census remains 2 of 2 on both sides.
#
# THE CONTROL DELIBERATELY KEEPS THE `## Invariants` TABLE. Deleting it would
# have made the pair differ in two things and would have hidden the finding:
# what separates a minted id class from an unminted one here is the HEADING
