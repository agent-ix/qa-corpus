# leaving the unminted rows exactly where they are and still going green.
#
# `untracked_symbols: []` is the assertion that matters most. Its partner names
# one entry; this names none. A change that stopped populating the field
# altogether would leave this block green and break the partner's, which is the
# direction that catches a silent removal.
