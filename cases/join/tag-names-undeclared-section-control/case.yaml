comment: >-
  The control supplies `TC-001` row evidence and changes `FR-001-INV-1` to
  `FR-001-AC-1`; the `## Invariants` table remains present and unminted. Across the pair,
  `backed` changes 1 -> 3, the criterion group changes 0/2 -> 1/2, the test-case group
  changes 1/2 -> 2/2, `unbacked_rows` changes 4 -> 2, and `untracked_symbols` changes 1 -> 0.
  KEEPING THE UNMINTED TABLE IS THE POINT. Deleting it would have made the pair differ in two
  things and would have hidden the finding: what separates a minted id class from an unminted
  one is the HEADING above the table, not the presence of the table, and this control proves
  that by leaving the unminted rows exactly where they are and still going green.
