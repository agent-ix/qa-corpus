# The LIVE contract. The defect is an ABSENT document, which is a different
# shape from every row before it — those seeded a malformed one.
#
# The declaration declares a `test-case` target over the TestMatrix archetype.
# This corpus has no TestMatrix, so the whole target kind is MISSING from
# `groups` rather than present and zero:
#
#   this case   groups [acceptance-criterion 0/1]
#   control     groups [acceptance-criterion 0/1, test-case 3/3]
#
# The consequence is RATIO INFLATION, not omission. Measured on this same tree:
#
#   no TestMatrix                       backed 1/1  = 100%
#   TestMatrix, 3 rows, all backed      backed 4/4  = 100%
#   TestMatrix, 3 rows, none backed     backed 1/4  =  25%
#
# So a repo with no TestMatrix sits at the TOP of a backing-ratio ranking, not
# omitted from it — writing the matrix is what makes the number fall. An
# earlier draft of this comment claimed the no-matrix and perfect-matrix
# payloads are indistinguishable; the control shipped beside it refutes that,
# and they differ on `groups`, `totals`, `untracked_symbols` and `metrics`.
#
# The real indistinguishability is narrower and still worth having: NO
# TestMatrix and a TestMatrix with ZERO ROWS produce byte-identical payloads.
#
# `groups` asserted EXACTLY is what pins the shape: a one-entry list is the
# claim that the second entry is absent, and `groups` is the only field that
# separates a MISSING group from a present-and-zero one. The other assertions
# here discriminate from the control too — all four do, independently — so this
# fixture does not rest on any one of them.
#
# TC-001 is not untracked because `FR-001.md`'s Verification column names it —
# the criterion row references it directly, so it is answered for even with no
# matrix. TC-002 and TC-003 are named nowhere and land homeless.
total: 1
backed: 0
groups:
  - document: spec/FR-001.md
    target: acceptance-criterion
    backed: 0
    total: 1
unbacked_rows: []
untracked_symbols:
  - symbol: "test_covers_the_second_criterion"
    trace_id: TC-002
    path: src/test_coverage.py
  - symbol: "test_covers_the_third_criterion"
    trace_id: TC-003
    path: src/test_coverage.py
binding_census:
  - language: python
    candidates: 3
    bound: 3
