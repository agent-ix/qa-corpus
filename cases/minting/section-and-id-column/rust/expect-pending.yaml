# FORWARD: what agent-ix/quire-rs#270 will make true. Required to FAIL until
# it lands.
#
# Only `section-matches-nothing` is asserted, and that is deliberate. The
# heading defect strands the table before the id column is ever read, so
# `id-column-matches-nothing` is NOT reachable on this input — asserting it
# would demand the engine report a defect it cannot observe.
#
# L3 names both the heading FOUND and the one DECLARED, because a reader of
# agent-ix/identity told only that "something matched nothing" cannot tell
# which of the two defects on this document to edit.
diagnostic_reasons:
  - section-matches-nothing
diagnostic_paths:
  section-matches-nothing: spec/tests.md
diagnostic_message_contains:
  section-matches-nothing:
    - "Test Cases"
    - "Test Case Summary"
    # THE THESIS OF THIS ROW, asserted rather than argued in a comment. The
    # heading defect strands the table, so the declared id column is never
    # checked — and a reader told only that the heading is wrong will fix it,
    # re-run, and meet a second defect that was there all along. The message
    # has to name what it could NOT check.
    #
    # A fragment on the EXISTING token, not a second token: an implementation
    # that also emits `id-column-matches-nothing` passes this unchanged, so
    # the fixture states the requirement without pre-deciding #270's shape.
    - "Test ID"
