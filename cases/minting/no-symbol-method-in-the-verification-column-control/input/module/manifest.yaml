name: bench
manifest_version: 1.0.0
version: 0.0.1
artifact_types:
- name: FR
  grammar_ref: iso-spec-core
- name: TestMatrix
traceability:
  trace_targets:
  - name: test-case
    archetype: TestMatrix
    section: Test Cases
    id_column: ID
  - name: acceptance-criterion
    archetype: FR
    section: Acceptance Criteria
    id_column: ID
  document_references:
  - name: verification
    archetype: FR
    section: Acceptance Criteria
    row_id_column: ID
    column: Verification
    targets: [test-case]
    pattern: '\b(TC-\d+)\b'
    strip_annotations: false
  status:
    column: Status
    complete: ["\u2705"]
    pending: ["\U0001F6A7"]
  vocabularies:
    test_type_column: Type
    test_type: [Unit, Inspection]
    no_source_symbol: [Inspection]
  trace_tags:
    markers:
    - name: rust-trace-attribute
      language: rust
      pattern: '#\[trace\(([^)]*)\)\]'
      template: '#[trace({ids})]'
