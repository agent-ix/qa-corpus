declaration_under_test: A test-case target whose `section` is a pattern reaching several headings is the measured condition. The multi-heading `*Test Case Summary*` declaration (spec-artifacts-process #70, commit 995288d) exists only on the upstream branch epic/264-assurance-integration and is NOT in the released module; the installed module names one heading and strands rows under sibling headings, so this case runs on the corpus variant.
id: rows-across-many-headings
case: rows-across-many-headings
