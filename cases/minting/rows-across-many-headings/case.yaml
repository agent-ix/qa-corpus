comment: >-
  A REGRESSION PIN, not a defect — the same reclassification #274's fixture took, for the
  same reason. Nothing here was ever misspelled: the declared heading is present and
  correct, the declared id column is correct, and all three tests bind. What was wrong was
  the ENGINE — `TraceTarget.section` took one heading name, so the two rows under the other
  two headings were invisible and the matrix reported a flawless `test-case 1/1` over a
  third of itself. agent-ix/identity carries roughly thirty such headings.
  agent-ix/quire-rs#272 (CR-118) made `section:` accept a list or a pattern, so a declaration that names the
  `*Test Case Summary*` family reaches all three. That declaration (spec-artifacts-process
  #70, commit 995288d) exists only on the upstream branch epic/264-assurance-integration
  and is NOT in the released module. The installed module names one heading, so it still
  strands rows under sibling headings. This case therefore binds a corpus-owned fixture
  module that declares the family.
  The input tree is byte-unchanged, which is exactly why the pair stopped discriminating:
  its healthy counterpart differs from it only in heading text, and the payloads are now
  identical. FR-065-AC-42 rejected the pair, correctly. The input is still the shape that
  used to strand rows, and asserting that it mints all four is worth keeping.
