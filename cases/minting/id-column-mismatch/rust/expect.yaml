# The whole contract, live. agent-ix/quire-rs#270 has landed, so what used to
# sit in expect-pending.yaml is folded in below and graded like everything else.
#
# The heading is RIGHT (`Test Case Summary`); the id column is not — this
# document says `Test Case ID` where the ecosystem declares `Test ID`.
#
# So the table IS read. The row mints, and its IDENTITY does not: `unbacked_rows`
# carries one row with `row_id: null`. That single field is the whole difference
# between this fixture and `section-name-mismatch`, whose every other key —
# totals, groups, diagnostics, binding_census — is byte-identical.
#
# Measured, not assumed. The claim first reported for this row was that the two
# payloads are INDISTINGUISHABLE; diffing them key by key showed they are not,
# and that nothing asserted the one key that differs.
total: 1
backed: 0
groups:
  - document: spec/FR-001.md
    target: acceptance-criterion
    backed: 0
    total: 1
unbacked_rows:
  - document: spec/tests.md
    row_id: null
    target_ids:
      - FR-001-AC-1
binding_census:
  - language: rust
    candidates: 1
    bound: 1
# ── agent-ix/quire-rs#270 LANDED (CR-117, v0.33.0 engine) ──────────────────
#
# Folded from expect-pending.yaml, RE-MEASURED against the payload. L3 is
# asserted because L1 is not enough here: agent-ix/identity has 606 TC ids
# minting nothing, and a finding that says only "something matched nothing"
# sends its reader to the heading, which is correct, and leaves all 606
# stranded. The message names the column FOUND and the column DECLARED.
diagnostic_reasons:
  - id-column-matches-nothing
diagnostic_paths:
  id-column-matches-nothing: spec/tests.md
diagnostic_message_contains:
  id-column-matches-nothing:
    - "Test Case ID"
    - "Test ID"
# The heading is RIGHT in this tree. Asserting the section token absent is what
# makes the pair a DISCRIMINATION rather than two fixtures that both fire: its
# sibling `section-name-mismatch` asserts the mirror image.
absent_diagnostic_reasons:
  - section-matches-nothing
