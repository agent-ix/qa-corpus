comment: 'CR-041''s exemption read `test_type_column` and nothing else, so the same declared vocabulary
  governed two columns and was consulted for one. Measured on filament-ide-rs @ 6f87a7e: 21 matrix rows
  exempt, 15 FR criteria rows naming the identical method NOT exempt. And the compare was exact, so `Inspection
  (TC-002)` would miss even reading the right column — eleven of the fifteen are annotated that way.
  MIGRATED off `bench-no-symbol-vocab` onto the real declaration (#285). The variant existed only to
  carry `no_source_symbol: [Inspection]`, which `spec-artifacts-process` has declared since CR-035 —
  `no_source_symbol: [Eval, Manual, Inspection, Analysis]`, `test_type_column: Type` — so the relaxation
  had already been retired upstream and nothing was left for it to relax. RE-MEASURED, and the payload
  moved: the ecosystem declares a `traces-to` reference on the matrix that the variant did not, so the
  matrix''s own `TC-002` row (typed `Inspection`) is now exempt too. Both halves of the pair gain that
  row; what still separates them is `FR-001-AC-2`, whose Verification cell reads `Inspection (TC-002)` —
  the column CR-041 did not consult.'
