comment: >-
  The same three rows and the same three tests, all under the ONE declared heading. It
  mints 3/3 and leaves nothing untracked — so a check that fired on every TestMatrix,
  or one that simply stopped reporting untracked symbols, could not score recall on this.
  It served TWO failure rows until agent-ix/quire-rs#272 landed: `rows-across-many-headings`
  scattered these rows across three headings, and `no-testmatrix-document` deletes the file.
  #272 made the engine read all three headings, so the first partner's payload became this
  one's and the pair had nothing left to separate — it is a `regression` pin now, and this
  control keeps only its second partner. A separate control for that one was byte-identical
  in all three languages.
