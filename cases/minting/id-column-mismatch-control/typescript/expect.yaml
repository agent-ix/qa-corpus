# The control: the same tree with the DECLARED id column.
#
# `groups` is what makes this control able to do its job. Its previous form
# asserted `total: 2`, which is satisfied by any two backed ids from anywhere —
# it could not say that THE TC ROW mints. `test-case 1/1` says exactly that,
# and `unbacked_rows: []` says the row that minted also bound.
#
# The absence tokens carry the two the engine really emits today alongside the
# forward one, so this control can fail now rather than only once #270 lands.
total: 2
backed: 1
groups:
  - document: spec/FR-001.md
    target: acceptance-criterion
    backed: 0
    total: 1
  - document: spec/tests.md
    target: test-case
    backed: 1
    total: 1
unbacked_rows: []
absent_diagnostic_reasons:
  - no-symbol-bound
  - hollow-denominator
  - section-matches-nothing
  - id-column-matches-nothing
binding_census:
  - language: typescript
    candidates: 1
    bound: 1
