comment: 'Archetype matches, SECTION DOES NOT. The document is a TestMatrix and the ecosystem declares
  `section: Test Case Summary`; this one says `Test Cases`. Measured across 239 repositories: 93 with
  the declared heading average 32.55% backed, 88 without it average 6.77%, and 3,514 distinct TC ids mint
  nothing. The first fixture in this corpus bound to the REAL declaration, and therefore the first that
  can exhibit the defect at all. Was `pending: agent-ix/quire-rs#270` from the day it was written; #270
  landed in quire-rs `a6a1144` and this case has passed on every engine from that commit onward. `verify.py`
  reported the stale marker on every run (`STALE  section-name-mismatch now PASSES`); quoin''s tier-1
  runner did not, because `section-matches-nothing` owned no family there and its stale-pending check
  returned before invoking the engine (agent-ix/quoin#236).'
