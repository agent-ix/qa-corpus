# The control: the same tree with the DECLARED heading.
#
# `groups` is what makes this control able to do its job. Its previous form
# asserted `total: 2`, which is satisfied by any two backed ids from anywhere —
# it could not say that THE TC ROW mints. `test-case 1/1` says exactly that,
# and `unbacked_rows: []` says the row that minted also bound.
#
# The absence tokens were written while two of the four were still forward, so
# this control could fail before #270 landed rather than only after. All four
# are emitted now, and all four must stay silent on a healthy matrix — which is
# the claim that stops the two new checks from being constants.
total: 2
backed: 1
groups:
  - document: spec/FR-001.md
    target: acceptance-criterion
    backed: 0
    total: 1
  - document: spec/tests.md
    target: test-case
    backed: 1
    total: 1
unbacked_rows: []
absent_diagnostic_reasons:
  - no-symbol-bound
  - hollow-denominator
  - section-matches-nothing
  - id-column-matches-nothing
binding_census:
  - language: rust
    candidates: 1
    bound: 1
