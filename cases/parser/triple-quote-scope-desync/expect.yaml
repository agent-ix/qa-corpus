# A REGRESSION PIN. This fixture landed RED against agent-ix/quire-rs#274 and
# is now green because the fix shipped. What it asserts is the fixed behaviour.
#
# WHAT USED TO HAPPEN. `python.rs` entered string mode only when a triple-quote
# STARTED the trimmed line, and two failures compounded on one string:
#
#   1. the opener does not start its line -> the string BODY was parsed as
#      code, INVENTING `test_phantom_inside_a_string` and binding TC-999 to it;
#   2. the CLOSING quote does start its line -> it was read as an OPENER, and
#      the rest of the file swallowed into a string that never ended, LOSING
#      the real test.
#
# The payload called that healthy: `binding_census 1 candidate, 1 bound` — for
# a symbol that does not exist in the program. The engine was measuring a
# string literal.
#
# WHAT HAPPENS NOW. The string is skipped, the real test is seen, and it backs
# its row. `untracked_symbols: []` is the assertion that the phantom is gone;
# `test-case 1/1` is the assertion that the real test came back.
#
# RECOVERY, measured on the real ecosystem rather than on this fixture:
#
#   py-project            102 -> 151 python binding candidates
#   filament-parser-lib   311 -> 395
#   quire-rs              125 -> 125   (no triple-quoted assignment)
#   sqlmodel-fixtures      74 ->  74   (same)
#
# The unaffected repos not moving is the half that matters: the gain is
# recovery, not inflation.
total: 2
backed: 1
groups:
  - document: spec/FR-001.md
    target: acceptance-criterion
    backed: 0
    total: 1
  - document: spec/tests.md
    target: test-case
    backed: 1
    total: 1
untracked_symbols: []
unbacked_rows: []
binding_census:
  - language: python
    candidates: 1
    bound: 1
