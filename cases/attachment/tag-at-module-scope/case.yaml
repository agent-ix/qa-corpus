comment: >-
  Rust is deliberately absent from this row's language set. `rust.rs` emits no file-level
  container, so a column-0 comment in a `.rs` file sits inside no symbol at all — a third case,
  not this one. Measured across ~/dev with worktrees and -task<N> copies excluded: 125 declared
  comment-id forms at column 0 in test files whose next code line is not a test registration,
  across 23 repos — python 96/18, rust 25/4, typescript 4/3.
  MIXED with a correctly-tagged sibling, because that is what real files look like and it is
  what keeps the census above the `binding_diagnostics` floor.
  PLAT-847 / CR-215: the citation is a comment, so it binds nothing and is reported once by the
  `trace-id-outside-marker` advisory (FR-051-AC-49); the control writes it as a marker.
