# THE CONTROL, AND ITS COVERAGE PAYLOAD IS IDENTICAL TO ITS PARTNER'S.
#
# That is deliberate and it is the point. One line changed: the annotation above
# `severityOf` stayed exactly where it was and became `// Implements:
# FR-001-AC-1`. The id-shaped comment is still sitting on production code — what
# changed is that it now names the relation that symbol kind can carry.
#
# So `backed`, `total`, `groups`, `unbacked_rows`, `untracked_symbols` and the
# census all read exactly as they do in the failure case, and they are asserted
# here so a reader can SEE that they do rather than infer it. TC-001 is still
# unbacked, correctly: no test verifies it, and a production symbol never could.
#
# `coverage.implements` is the whole separation, and FR-065-AC-42 rests on it
# alone. 0 matched there, 2 here, over the same 4 production symbols
# examined. A fixture pair that could only be told apart by an incidental scalar
# would be the weakness FR-065 records against ten of the other eleven
# controlled fixtures; this one is forced onto the field the defect is about.
#
# AND THIS IS THE HARD CASE FOR #312. The naive detector — "any declared
# trace-id form inside a symbol that does not bind trace ids" — fires here, on a
# production symbol annotated exactly as the declaration says to annotate it.
# `tag-on-non-binding-symbol` in `absent_diagnostic_reasons` is vacuous today
# and is that check the day the ticket lands. A failure case may not make the
# claim (FR-065-AC-32); a control is what it is for.
total: 4
backed: 1
groups:
  - document: spec/FR-001.md
    target: acceptance-criterion
    backed: 0
    total: 2
  - document: spec/tests.md
    target: test-case
    backed: 1
    total: 2
unbacked_rows:
  - document: spec/tests.md
    row_id: TC-001
    target_ids: [FR-001-AC-1, TC-001]
  - document: spec/FR-001.md
    row_id: FR-001-AC-1
    target_ids: [FR-001-AC-1, TC-001]
untracked_symbols: []
binding_census:
  - language: typescript
    candidates: 1
    bound: 1
# RE-COUNTED under CR-119 (`agent-ix/quire-rs#273`): 4 rather than 3, because
# `describe("coverage")` in the test file now mints a CONTAINER and a container
# is an `implements` candidate. The two module containers and `severityOf` are
# unchanged. `value`/`matched` — the field this pair is separated by — is not
# touched by it, in either half.
metrics:
  - name: coverage.implements
    state: measured
    value: 2
    population: 4
    examined: 4
    matched: 2
absent_diagnostic_reasons:
  - no-symbol-bound
  - low-symbol-binding
  - hollow-denominator
  - tag-on-non-binding-symbol
