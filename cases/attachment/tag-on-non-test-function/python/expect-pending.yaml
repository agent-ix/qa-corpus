# FORWARD: what agent-ix/quire-rs#312 makes true.
#
# A DIAGNOSTIC ticket, not a behaviour change — the tag still will not bind
# after the fix, and it should not: CR-061 is right that production code is not
# evidence. What changes is that the engine stops dropping the tag in silence.
# So this block states nothing about the payload; every count in `expect.yaml`
# survives the fix unchanged, which is what makes the live block safe to assert
# today.
#
# L3 has to name THE SYMBOL KIND and the channel that WOULD have taken it.
# "This row is unbacked" is already in the report and is not actionable; "your
# tag is on production code, and the form that channel reads is `Implements:`"
# is the fix, and it is the sentence the control proves must not be printed for
# a symbol already annotated that way.
diagnostic_reasons:
  - tag-on-non-binding-symbol
diagnostic_paths:
  tag-on-non-binding-symbol: src/coverage.py
diagnostic_message_contains:
  tag-on-non-binding-symbol:
    # The id that was written, verbatim — without it the reader has a file and
    # not a line.
    - "TC-001"
    # The symbol it landed on and its kind, which is the whole fix.
    - "normalize_severity"
    - "function"
    # The channel that would have accepted an annotation on this symbol.
    - "Implements:"
    # And the consequence, so this is not read as a style note.
    - "unbacked"
