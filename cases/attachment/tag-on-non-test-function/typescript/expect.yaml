# THE CENSUS READS 100% AND A ROW IS UNBACKED.
#
#   binding_census  typescript  candidates 1, bound 1  <- no unbound_example
#   groups          test-case 1 of 2
#   unbacked_rows   TC-001, FR-001-AC-1
#
# Those three lines are the defect. `severityOf` is an exported arrow-const, so
# `SymbolKind::Function`, and `binds_trace_ids()` is false for that kind
# (CR-061: production doc comments routinely CITE the criterion they implement,
# and binding them would mass-manufacture backing out of prose).
#
# THE TAG IS NOT A MISS, IT IS AN ABSENCE. `trace::bind` reaches
# the `carries_implements()` branch at `trace.rs:261`, which `continue`s at 271 — and the
# census `candidates` counter is incremented AFTER that guard. So the symbol is
# missing from the DENOMINATOR rather than counted as an unbound candidate, and
# there is no `unbound_example` because nothing was ever unbound.
#
# THE PREDICATES ARE EXACT COMPLEMENTS, which is why this is one defect and not
# two. `binds_trace_ids()` is {TestFunction, Benchmark, FuzzTarget};
# `carries_implements()` is {Function, Container}. Five variants, disjoint,
# covering — so every symbol that cannot bind has ALREADY been consumed by the
# implements branch. (The `!binds_trace_ids()` guard twelve lines below it is
# therefore dead code; noted on #312.)
#
# That matters for the fix: at 261 the symbol is already being counted as an
# `implements` candidate, so admitting it to `binding_census.candidates` would
# double-count it across two censuses. #312's original citation hid that.
#
# That is what separates this row from `tag-at-module-scope`, whose numbers are
# otherwise the same: there the misplaced tag leaves a real test unbound and the
# census falls to 50%; here it leaves nothing unbound at all and the census is
# perfect. A repository whose tags are ALL on production code reads 100% bound.
#
# NEITHER CHANNEL RECEIVES IT.
#
#   verifies           refused by symbol kind
#   untracked_symbols  built from `graph.verifies` (`coverage.rs:1194`), so it
#                      reports ids that BOUND and matched no row. A tag that
#                      never bound is not there.
#   implements         `typescript-implements-line` needs the literal
#                      `Implements:` keyword; `// TC-001: Warning default.` does
#                      not carry it.
#
# AND THE ENGINE WALKED THAT EXACT SYMBOL. `coverage.implements` says four
# production symbols were examined — the two module containers, the
# `describe("coverage")` suite container CR-119 added, and `severityOf` — and
# none carried a marker. The engine looked at the symbol the tag is on,
# for the other relation, and published a bare zero.
#
# THIS IS THE FIELD THAT DISCRIMINATES, and it is the only one. The control
# leaves the annotation where it is and rewrites it as `// Implements:
# FR-001-AC-1`, so every count below is byte-identical there — same `backed`,
# same `groups`, same `unbacked_rows`, same census. `coverage.implements` goes
# to 2 matched.
total: 4
backed: 1
groups:
  - document: spec/FR-001.md
    target: acceptance-criterion
    backed: 0
    total: 2
  - document: spec/tests.md
    target: test-case
    backed: 1
    total: 2
unbacked_rows:
  - document: spec/tests.md
    row_id: TC-001
    target_ids: [FR-001-AC-1, TC-001]
  - document: spec/FR-001.md
    row_id: FR-001-AC-1
    target_ids: [FR-001-AC-1, TC-001]
untracked_symbols: []
binding_census:
  - language: typescript
    candidates: 1
    bound: 1
# RE-COUNTED under CR-119 (`agent-ix/quire-rs#273`): 4 rather than 3, because
# `describe("coverage")` in the test file now mints a CONTAINER and a container
# is an `implements` candidate. The two module containers and `severityOf` are
# unchanged. `value`/`matched` — the field this pair is separated by — is not
# touched by it, in either half.
metrics:
  - name: coverage.implements
    state: measured
    value: 0
    population: 4
    examined: 4
    matched: 0
absent_diagnostic_reasons:
  - no-symbol-bound
  - low-symbol-binding
  - hollow-denominator

# ── agent-ix/quire-rs#312 LANDED: what was the forward block is now live ──
#
# Folded in from `expect-pending.yaml` unchanged. Every count above is
# untouched by the fix, which is what the forward block said it would be: a
# DIAGNOSTIC ticket, not a behaviour change. The tag still does not bind and
# it should not (CR-061) — the engine has stopped dropping it in silence.
diagnostic_reasons:
  - tag-on-non-binding-symbol
diagnostic_paths:
  tag-on-non-binding-symbol: src/coverage.ts
diagnostic_message_contains:
  tag-on-non-binding-symbol:
    # The id that was written, verbatim — without it the reader has a file and
    # not a line.
    - "TC-001"
    # The symbol it landed on and its kind, which is the whole fix.
    - "severityOf"
    - "function"
    # The channel that would have accepted an annotation on this symbol.
    - "Implements:"
    # And the consequence, so this is not read as a style note.
    - "unbacked"
