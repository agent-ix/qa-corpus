comment: >-
  THE CENSUS READS 1 OF 1 — a flawless 100% — while the row that tag names is reported
  unbacked, and there is no `unbound_example` to follow because nothing was ever unbound. That
  is the sharpest form of this defect and it is why the tree carries exactly one test.
  Measured over ~/dev with worktrees, -task<N> copies, node_modules, build and virtualenv
  trees excluded, and this repository excluded: 1,677 declared comment-id forms in non-test
  files across 86 repos — python 497/47, rust 943/6, typescript 237/36. Shapes taken from
  k8s-orchestration/k8s_orchestration/retry.py:15, catalog-mcp-ui/src/ElementList.tsx:20 and
  quire-rs/src/corpus/validate.rs:253.
