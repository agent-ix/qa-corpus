comment: >-
  The control for `marker-mismatch`: the identical tree with `#[tracks(…)]` spelled `#[trace(…)]`, the
  form the module declares. ONE IDENTIFIER DIFFERS and nothing else, so the pair separates on whether a
  written tag was READ and on nothing incidental — which is the whole of the defect its partner seeds.
  Distinct from `marker-form-mismatch-control` on purpose: that control repairs a different tree, and one
  control standing in for two failure cases would let either partner's tree drift without a gate noticing.
