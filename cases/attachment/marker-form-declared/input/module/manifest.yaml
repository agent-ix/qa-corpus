name: bench
manifest_version: 1.0.0
version: 0.0.1
artifact_types:
- name: FR
  grammar_ref: iso-spec-core
- name: TestMatrix
traceability:
  trace_targets:
  - name: test-case
    archetype: TestMatrix
    section: Test Cases
    id_column: ID
  - name: acceptance-criterion
    archetype: FR
    section: Acceptance Criteria
    id_column: ID
  document_references:
  - name: traces-to
    archetype: TestMatrix
    section: Test Cases
    row_id_column: ID
    column: Traces To
    targets: [acceptance-criterion, test-case]
    pattern: '([A-Z]{2,4}-\d+(?:-[A-Z]{2,4}-\d+)?)'
  status:
    column: Status
    complete: ["\u2705"]
    pending: ["\U0001F6A7"]
  trace_tags:
    markers:
    - name: rust-trace-attribute
      language: rust
      pattern: '#\[trace\(([^)]*)\)\]'
      template: '#[trace({ids})]'
