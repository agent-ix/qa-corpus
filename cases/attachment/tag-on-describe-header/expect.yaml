# THE TAG REACHES NEITHER CHANNEL, and since `agent-ix/quire-rs#273` landed
# that is no longer because there is nothing to attach to.
#
# WHAT #273 CHANGED. `describe(…)` registered no symbol at all, so the nearest
# enclosing symbol was the file's own module — a container spanning line 1 to
# EOF, which names no locus a reader can act on. It now mints a CONTAINER named
# `warning default`, spanning lines 6-13, and the `it` inside it is parented to
# it. The one payload field that moved is asserted below:
# `coverage.implements examined` 1 -> 2, the suite entering the production-symbol
# denominator. Measured over 241 repositories, same binary, only that change:
# rows minted 20,023 -> 20,023, rows backed 5,039 -> 5,039, every diagnostic
# count identical, every `binding_census` identical. #273 alone moves NOTHING.
#
# WHAT IT DID NOT CHANGE, AND WHY. A `Container` is refused by
# `SymbolKind::binds_trace_ids()` and accepted by `carries_implements()`, so
# `trace::bind` takes the `carries_implements()` branch at `trace.rs:261` and
# `continue`s at 271 — the suite never reaches the `verifies` binder, and it
# enters `implements_candidates` instead of `binding_census.candidates`.
# `untracked_symbols` cannot see it either: that channel is built from
# `graph.verifies` (`coverage.rs:1194`) and reports ids that BOUND and matched
# no minted row. As #273 put it: silence, not a miss.
#
# THE SEMANTICS ARE NOW DECLARED (FR-051-AC-21) rather than accidental: a suite
# GROUPS evidence and is not evidence. Widening `verifies` to reach a
# `Container` would reach EVERY container, the file's own module included, so
# every column-0 comment id in every TypeScript and Python test file would back
# a row — the CR-061 prohibition from the other side. Measured on this corpus
# with `Container` moved into `binds_trace_ids()`, that is what happens.
#
# So what is left is `agent-ix/quire-rs#312`: a tag on a symbol whose kind
# cannot bind it reaches no channel and is missing from the census it should be
# unbound in.
#
# THE FIXTURE IS MIXED ON PURPOSE. One misattached tag beside one correct one,
# because that is what real files look like — and it is the configuration in
# which the engine says nothing:
#
#   binding_census  candidates 2, bound 1     = 50% bound
#
# `binding_diagnostics` fires on `bound == 0` or `bound < candidates * 0.05`.
# One tag in two clears that floor easily; one tag in two hundred clears it by
# more. The floor catches "this repo's tags do not work at all" and is blind to
# "one tag in this repo is on the wrong node", which is the common case.
#
# A degenerate all-tags-misattached tree WOULD fire `no-symbol-bound`. Writing
# the fixture that way would have made it pass for a reason that does not hold
# in any real repository.
#
# AND THE ENGINE ALREADY HAS THE LOCUS. `unbound_example` names
# `defaults every finding to warning` at src/coverage.test.ts:10 — the exact
# test left unbound because its tag sits one line above it. The evidence is
# computed and carried; only the report is suppressed. Same shape as #304,
# where a finding is computed and discarded by a model-wide gate.
total: 4
backed: 1
groups:
  - document: spec/FR-001.md
    target: acceptance-criterion
    backed: 0
    total: 2
  - document: spec/tests.md
    target: test-case
    backed: 1
    total: 2
# EMPTY, and that is the assertion. A tag that bound to the wrong id would be
# here; this one is nowhere.
untracked_symbols: []
unbacked_rows:
  - document: spec/tests.md
    row_id: TC-001
    target_ids: [FR-001-AC-1, TC-001]
  - document: spec/FR-001.md
    row_id: FR-001-AC-1
    target_ids: [FR-001-AC-1, TC-001]
binding_census:
  - language: typescript
    candidates: 2
    bound: 1
    unbound_example: src/coverage.test.ts:14
# The suite is a symbol NOW — read `2` as "module container plus the
# `describe(…)` container", where it read `1` before #273. This is the whole
# observable delta of that ticket on this tree, which is why it is asserted
# here rather than described in prose: an engine that stopped registering the
# header would go back to reading `1` and this line would catch it.
metrics:
  - name: coverage.implements
    state: measured
    value: 0
    examined: 2
    matched: 0
absent_diagnostic_reasons:
  - no-symbol-bound
  - low-symbol-binding
  - hollow-denominator
