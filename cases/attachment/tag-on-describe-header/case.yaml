pending_reason: >-
  TWO TICKETS, and #273 has landed its half. #273 registered the header as a `Container`, so the
  tag now attaches to `describe("warning default")` instead of to the file's module — asserted in
  `expect.yaml` as `coverage.implements examined 2`. It changed no row: measured over 241
  repositories, rows minted 20,023 -> 20,023 and rows backed 5,039 -> 5,039. A `Container` is
  refused by `binds_trace_ids()` and accepted by `carries_implements()`, so `trace::bind` takes
  the branch at `trace.rs:261` and `continue`s at 271 before the census counts anything; and
  `untracked_symbols` is built from `graph.verifies`, so a tag that never bound is not there
  either. The forward block below therefore waits on #312 — the channel — not on #273. FR-051-AC-21
  now DECLARES that a suite groups evidence and is not evidence, because widening `verifies` to a
  `Container` reaches every container including the file's own module, whose span is line 1 to EOF.
