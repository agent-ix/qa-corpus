comment: 'A test whose NAME carries an id the matrix does not declare while its marker carries one it
  does. The binding is correct; the name is stale. Neither the row nor the symbol should be reported as
  a defect. MIGRATED off `bench-legacy` onto the real declaration (#285), and this is the case where the
  rebind changed the payload. `bench-legacy` declares ONE rust form, `rust-trace-attribute`; it never
  read a function name at all, so `fn tc_999_renamed_but_still_correct` was invisible and
  `untracked_symbols` was empty. The case asserted the absence of something that could not have been
  present — it could not exhibit its own defect. The ecosystem declares `rust-test-name-id`
  (`\bfn (?i:tc)_?(\d+)_`), so the stale name now mints `TC-999`, it reaches no declared row, and it
  lands in `untracked_symbols` with its path and line. That entry is the case, and it is asserted below
  rather than assumed. `TC-999` against `TC-001` is not a near miss, so `agent-ix/quire-rs#307`''s
  forward token is not in play here.'
