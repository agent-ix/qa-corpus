- binding
comment: 'The control: the identical tree with the stale id taken out of the function NAME. The marker
  is unchanged, so the row is backed either way — and `untracked_symbols` is EMPTY here against one entry
  in the partner. That is the whole difference between the two trees, which is what makes the partner''s
  assertion a measurement of the stale name rather than of a healthy corpus. This control was
  unwritable before #285: on `bench-legacy`, which declares no name-shaped rust form, both trees produce
  the identical payload and the pair would have had nothing to separate. Writing it retires
  `stale-name-correct-trace` from `known_gaps.uncontrolled_failure_cases` (agent-ix/quire-rs#286).'
