comment: >-
  The control for `hollow-metric`: the identical tree with the declared marker written on the test that was
  carrying none. Its partner publishes `coverage.backed` as a ratio over rows the binder could read NOTHING
  of — a number that is arithmetic over nothing rather than a low score — and the repair is the one line
  that makes the denominator real. The pair separates on `binding_census.bound` and on the two diagnostics,
  which is what makes `hollow-denominator` a check rather than a constant.
