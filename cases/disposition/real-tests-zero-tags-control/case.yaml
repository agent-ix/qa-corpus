comment: >-
  The SAME two tests with a tag added to each. Same names, same bodies, same assertions —
  the only difference is that this tree has been authored against the matrix and its partner
  has not. That is the disposition the pair exists to separate, and it is why the control
  matters more here than anywhere else in the corpus: `no-symbol-bound` fires whenever a
  language binds nothing, so a check that could not stay silent on a tagged tree would score
  perfect recall on the mode this row is named for.
